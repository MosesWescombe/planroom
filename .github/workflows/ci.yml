name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test
              env:
                  OPENSPEC_TELEMETRY: '0'
            - run: pnpm build

    publish:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: check
        runs-on: ubuntu-latest
        # npm trusted publishing: the OIDC id-token stands in for a stored npm token.
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
            # prepack builds dist/ first. npm, not pnpm, does the OIDC exchange and adds provenance.
            - run: npm publish
